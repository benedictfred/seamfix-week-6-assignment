<div class="top-bar">
  <div class="top-bar-left">
    <span>Young Researcher Academy · Publish · Research · Impact · Collaborate</span>
  </div>
  <div class="top-bar-right">
    <span>Ile-Ife, Osun State, Nigeria</span>
  </div>
</div>

<nav class="navbar">
  <div class="navbar-logo" routerLink="/">
    <img src="/young-researcher-logo.jpeg" alt="Logo" class="logo-icon" />
    <div class="logo-text">
      <span class="logo-title">Young Researcher</span>
      <span class="logo-subtitle">Academy</span>
    </div>
  </div>

  <ul class="nav-links">
    <li><a routerLink="/about" routerLinkActive="active">About</a></li>
    <li><a routerLink="/programmes" routerLinkActive="active">Programmes</a></li>
    <li><a routerLink="/resources" routerLinkActive="active">Resources</a></li>
    <li><a routerLink="/events" routerLinkActive="active">Events</a></li>
    <li><a routerLink="/media" routerLinkActive="active">Media</a></li>
    <li><a routerLink="/opportunities" routerLinkActive="active">Opportunities</a></li>
    <li><a routerLink="/community" routerLinkActive="active">Community</a></li>
  </ul>

  <div class="nav-actions">
    <select name="color" (change)="changeColor($event)" id="" class="color-select">
      <option value="blue">Blue</option>
      <option value="yellow">Yellow</option>
      <option value="red">Red</option>
      <option value="black">Black</option>
    </select>
    <button class="btn-login" routerLink="/login">Login</button>
  </div>
</nav>

<main class="main-content" [ngStyle]="{ 'background-color': bgColor() }">
  <router-outlet></router-outlet>
</main>
